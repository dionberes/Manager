<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="frontend/style.css">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="apple-mobile-web-app-title" content="Manager">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container" id="home-section">
        <div class="sec-header-bar">
            <div class="header-title">
                <h2>Manager</h2>
            </div>   
        </div>
        <div class="content" style="margin-top: -30px;">
            <div class="sec">
                <div class="input-group">
                    <div>
                        <section class="i-sec" style="padding-bottom: 10px;">
                            <h1>Startzeit</h1>
                            <input type="time" id="start-time">
                        </section>
                        <section class="i-sec">
                            <h1>Endzeit</h1>
                            <input type="time" id="end-time">
                        </section>
                    </div>
                </div>
                
            </div>

            <div class="sec1">
                <div class="result-sec">
                    <h1>Gesamtzeit</h1>
                    <div id="total-time">00:00</div>
                    <div id="isOvertime">+00:00</div>
                    <progress class="progress" id="work-progress" min="0" max="7" value="7" aria-label="Verbleibend bis Sollzeit"></progress>
                </div>
            </div>
        </div>
        <button id="save-entry" class="save-btn">Eintrag speichern</button>
    </div>

    <div style="width: 90%; margin: 0 auto;">        
        <div class="chart-container">
            <canvas id="myCustomChart"></canvas>
        </div>            
    </div>   
    <div class="container" style="margin: 30px auto;background: #f5f5f5; border-radius: 10px; padding: 20px;">
        <div class="sec" style="justify-content: center; margin-bottom: 30px;">
            <h2>DIESE WOCHE</h2>
        </div>
        <div id="week-table"></div>
        <section class="all-time" style="margin-bottom: 10vh;">
            <span class="all-time-text">0h 00m</span>
            <span class="week-overtime">Überstunden: +00:00</span>
        </section>
    </div>

    <div id="settings-modal" class="modal" hidden>
        <div class="modal-backdrop" id="settings-modal-backdrop"></div>
        <div class="modal-dialog" role="dialog" aria-labelledby="settings-title">
            <h3 id="settings-title">Zeitziel</h3>
            <p class="modal-hint">Tägliches Zeitziel und Arbeitstage einstellen.</p>
            <label class="modal-label" for="target-hours-input">Stunden pro Tag</label>
            <input type="number" id="target-hours-input" min="0.25" max="24" step="0.25" value="7">
            <label class="modal-label">Arbeitstage</label>
            <div class="weekday-checkboxes">
                <label><input type="checkbox" value="Montag" class="weekday-checkbox"> Mo</label>
                <label><input type="checkbox" value="Dienstag" class="weekday-checkbox"> Di</label>
                <label><input type="checkbox" value="Mittwoch" class="weekday-checkbox"> Mi</label>
                <label><input type="checkbox" value="Donnerstag" class="weekday-checkbox"> Do</label>
                <label><input type="checkbox" value="Freitag" class="weekday-checkbox"> Fr</label>
                <label><input type="checkbox" value="Samstag" class="weekday-checkbox"> Sa</label>
                <label><input type="checkbox" value="Sonntag" class="weekday-checkbox"> So</label>
            </div>
        </div>
    </div>

    <div class="fo-he"> 
        <nav class="fo-he">
            <a href="#home-section">
                <i class="fi fi-rr-home"></i>
                <h3>Home</h3>
            </a>

            <a href="#myCustomChart">
                <i class="fi fi-rr-stats"></i>
                <h3>Statistics</h3>
            </a>
            <a>
                <button id="open-settings"><i class="fi fi-rr-user"></i></button>
                <h3>User</h3>
            </a>
        </nav>

    </div>

    <script src="backend/LocalStorage.js"></script>
    
</body>
</html>
